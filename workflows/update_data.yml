name: Daily Map Update
on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every single night at 2:00 AM
  workflow_dispatch: # Allows you to manually trigger the update with a button click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Fetch fresh data from Intervals
        env:
          YOUR_INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          YOUR_INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python update_map.py
        
      - name: Commit and push changes to live site
        run: |
          git config --global user.name "Map Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Auto-updated activity maps" || exit 0
          git push
