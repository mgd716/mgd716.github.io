<!DOCTYPE html>
<html>
<head>
    <title>My Personal Tracker Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; background-color: #111; }
        #map { height: 100vh; width: 100%; position: absolute; z-index: 1; }
        #sidebar {
            position: absolute; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9);
            color: white; padding: 15px; border-radius: 8px; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 160px;
        }
        #year-select { width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border-radius: 4px; }
        .leaflet-popup-tip { background: #222; }
    </style>
</head>
<body>

    <div id="sidebar">
        <label style="font-weight:bold; display:block; margin-bottom:5px;">Filter by Year</label>
        <select id="year-select" onchange="filterMapByYear()">
            <option value="ALL">Show All Years</option>
        </select>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([0, 0], 2);

       L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        const layers = {
            'Runs': L.layerGroup().addTo(map),
            'Rides': L.layerGroup().addTo(map),
            'Hikes': L.layerGroup().addTo(map),
            'Swims': L.layerGroup().addTo(map),
            'Other': L.layerGroup().addTo(map)
            'Tile Grid': L.layerGroup().addTo(map)
        };

        L.control.layers(null, layers, { collapsed: false }).addTo(map);

        function getSportConfig(type) {
            switch(type) {
                case 'Run': return { color: '#ff4500', group: layers['Runs'] };
                case 'Ride': case 'VirtualRide': return { color: '#00ced1', group: layers['Rides'] };
                case 'Hike': case 'Walk': return { color: '#32cd32', group: layers['Hikes'] };
                case 'Swim': return { color: '#1e90ff', group: layers['Swims'] };
                default: return { color: '#ffffff', group: layers['Other'] };
            }
        }

        let rawActivitiesCache = [];
        let runningMapLines = [];

        fetch('./data.json')
            .then(response => response.json())
            .then(activities => {
                rawActivitiesCache = activities;

                // Extract and sort unique year strings for selector dropdown options
                const years = [...new Set(activities.map(a => a.year))].sort((a,b) => b - a);
                const dropdown = document.getElementById('year-select');
                years.forEach(year => {
                    if(year && year !== "Unknown") {
                        const opt = document.createElement('option');
                        opt.value = year; opt.textContent = year;
                        dropdown.appendChild(opt);
                    }
                });

                drawTracks("ALL");
            })
            .catch(err => console.error("Error loading activities:", err));

     function drawTracks(targetYear) {
            runningMapLines.forEach(line => line.remove());
            runningMapLines = [];

            const allPolylines = [];

            rawActivitiesCache.forEach(activity => {
                // Skip if filtering by year and it doesn't match
                if (targetYear !== "ALL" && String(activity.year) !== String(targetYear)) {
                    return;
                }

                // Ensure valid coordinates exist
                if (!activity.coordinates || activity.coordinates.length === 0) {
                    return;
                }

                const config = getSportConfig(activity.type);
                
                // Create polyline from coordinates
                const line = L.polyline(activity.coordinates, {
                    color: config.color,
                    weight: 3,
                    opacity: 0.8
                });

                line.bindPopup(`<a href="https://intervals.icu/activities/${activity.id}" target="_blank" style="color: #4da6ff; text-decoration: none;"><strong>${activity.name}</strong></a><br><small>${activity.type} | ${activity.year}</small>`);
                line.addTo(config.group);
                
                runningMapLines.push(line);
                allPolylines.push(line);
            });

            // Automatically zoom the map to fit all loaded activities
            if (allPolylines.length > 0) {
                const group = L.featureGroup(allPolylines);
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }
        }

        function filterMapByYear() {
            drawTracks(document.getElementById('year-select').value);
        }
        
        function drawTileGrid() {
            layers['Tile Grid'].clearLayers();
            
            // RideEveryTile and VeloViewer use zoom level 14
            const TILE_ZOOM = 14; 
            
            // Prevent browser crashes by only drawing the grid when zoomed in
            if (map.getZoom() < 12) return;

            const bounds = map.getBounds();
            
            // Project the screen's corners to zoom level 14 pixel coordinates
            const nwPoint = map.project(bounds.getNorthWest(), TILE_ZOOM);
            const sePoint = map.project(bounds.getSouthEast(), TILE_ZOOM);

            // Leaflet map tiles are exactly 256x256 pixels
            const minX = Math.floor(nwPoint.x / 256);
            const maxX = Math.floor(sePoint.x / 256);
            const minY = Math.floor(nwPoint.y / 256);
            const maxY = Math.floor(sePoint.y / 256);

            // Loop through the visible grid and draw rectangles
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    // Unproject back to Latitude and Longitude to draw the box
                    const tileNw = map.unproject(L.point(x * 256, y * 256), TILE_ZOOM);
                    const tileSe = map.unproject(L.point((x + 1) * 256, (y + 1) * 256), TILE_ZOOM);
                    
                    L.rectangle(L.latLngBounds(tileNw, tileSe), {
                        color: '#555',       // Dark grey lines
                        weight: 1,           // Thin borders
                        fillOpacity: 0,      // Transparent inside
                        interactive: false   // Clicks pass through to your activities
                    }).addTo(layers['Tile Grid']);
                }
            }
        }

        // Redraw the grid whenever the map is panned or zoomed
        map.on('moveend', drawTileGrid);
        
        // Trigger the first draw
        drawTileGrid();
    </script>
</body>
</html>
