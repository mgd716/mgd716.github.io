<!DOCTYPE html>
<html>
<head>
    <title>My Permanent Map with Filters</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; background-color: #111; }
        #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #filter-sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 200px;
        }
        #filter-sidebar h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        #year-select {
            width: 100%;
            padding: 8px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border-radius: 4px; }
        .leaflet-popup-tip { background: #222; }
    </style>
</head>
<body>

    <div id="filter-sidebar">
        <h3>Filter by Year</h3>
        <select id="year-select" onchange="filterMapByYear()">
            <option value="ALL">Show All Years</option>
        </select>
    </div>

    <div id="map"></div>

    <script>
        // FIXED: Added a universal fallback starting position [0, 0] and zoom level 2 
        // This guarantees the dark map grid loads instantly on screen before checking files
        const map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const layers = {
            'Runs': L.layerGroup().addTo(map),
            'Rides': L.layerGroup().addTo(map),
            'Hikes': L.layerGroup().addTo(map),
            'Swims': L.layerGroup().addTo(map),
            'Other': L.layerGroup().addTo(map)
        };

        L.control.layers(null, layers, { collapsed: false }).addTo(map);

        function getSportConfig(type) {
            switch(type) {
                case 'Run': return { color: '#ff4500', group: layers['Runs'] };
                case 'Ride': case 'VirtualRide': return { color: '#00ced1', group: layers['Rides'] };
                case 'Hike': case 'Walk': return { color: '#32cd32', group: layers['Hikes'] };
                case 'Swim': return { color: '#1e90ff', group: layers['Swims'] };
                default: return { color: '#ffffff', group: layers['Other'] };
            }
        }

        let rawActivitiesCache = [];
        let runningMapLines = [];

        fetch('./data.json')
            .then(response => response.json())
            .then(activities => {
                // Pre-process and clean data if years were saved as array lists
                rawActivitiesCache = activities.map(act => {
                    if (Array.isArray(act.year)) {
                        act.year = act.year[0]; // Clean layout array down to a string
                    }
                    return act;
                });

                const years = [...new Set(rawActivitiesCache.map(a => a.year))].sort((a,b) => b - a);
                const dropdown = document.getElementById('year-select');
                years.forEach(year => {
                    if(year && year !== "Unknown") {
                        const opt = document.createElement('option');
                        opt.value = year;
                        opt.textContent = year;
                        dropdown.appendChild(opt);
                    }
                });

                drawTracks("ALL");
            })
            .catch(err => console.error("Error loading activities:", err));

        function drawTracks(targetYear) {
            runningMapLines.forEach(line => line.remove());
            runningMapLines = [];

            const boundsArray = [];

            rawActivitiesCache.forEach(activity => {
                if (targetYear !== "ALL" && String(activity.year) !== String(targetYear)) {
                    return;
                }

                const config = getSportConfig(activity.type);
                const line = L.polyline(activity.coordinates, {
                    color: config.color,
                    weight: 2,
                    opacity: 0.6
                });

                const popupContent = `<strong>${activity.name}</strong><br><small>${activity.type} | ${activity.year}</small>`;
                line.bindPopup(popupContent);

                line.addTo(config.group);
                runningMapLines.push(line);
                boundsArray.push(line.getBounds());
            });

            // Adjust zoom dynamically only if tracks exist to prevent errors
            if (boundsArray.length > 0) {
                const featureGroup = L.featureGroup(runningMapLines);
                map.fitBounds(featureGroup.getBounds(), { padding: [30, 30] });
            }
        }

        function filterMapByYear() {
            const selectedYear = document.getElementById('year-select').value;
            drawTracks(selectedYear);
        }
    </script>
</body>
</html>
